name: Deploy Power Grid Web to Production

on:
  push:
    branches:
      - main
      - master
  pull_request:
    types: [opened, synchronize, reopened]

env:
  REGISTRY: ci.gmac.io
  IMAGE_NAME: ${{ gitea.repository }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Container Registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ gitea.actor }}
          password: ${{ secrets.GITEATOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push React client Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max

      - name: Display pushed image tags
        run: |
          echo "Image tags that were pushed:"
          echo "${{ steps.meta.outputs.tags }}"
          echo ""
          echo "Will deploy with image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}"
          echo ""
          # Extract the first tag to use for deployment
          FIRST_TAG=$(echo "${{ steps.meta.outputs.tags }}" | head -n1 | cut -d':' -f2)
          echo "DEPLOY_TAG=$FIRST_TAG" >> $GITHUB_ENV
          echo "Using tag: $FIRST_TAG"

      - name: Deploy to K3s
        env:
          KUBECONFIG_CONTENT: ${{ secrets.KUBECONFIG }}
        run: |
          # Install kubectl
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/
          kubectl version --client
          
          # Setup kubeconfig
          mkdir -p ~/.kube
          echo "$KUBECONFIG_CONTENT" | base64 -d > ~/.kube/config
          
          # Determine deployment environment
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            NAMESPACE="staging"
            APP_NAME="power-grid-pr-${{ github.event.pull_request.number }}"
            INGRESS_HOST="staging-pr-${{ github.event.pull_request.number }}.gmac.io"
          else
            NAMESPACE="default"
            APP_NAME="power-grid-web"
            INGRESS_HOST="power-grid.gmac.io"
          fi
          
          # Create namespace if it doesn't exist
          kubectl create namespace $NAMESPACE --dry-run=client -o yaml | kubectl apply -f -
          
          # Generate deployment manifest
          cat > deployment.yaml <<EOF
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: $APP_NAME
            namespace: $NAMESPACE
            labels:
              app: $APP_NAME
              component: frontend
              version: "${{ github.sha }}"
          spec:
            replicas: 2
            selector:
              matchLabels:
                app: $APP_NAME
            template:
              metadata:
                labels:
                  app: $APP_NAME
                  component: frontend
                  version: "${{ github.sha }}"
                annotations:
                  prometheus.io/scrape: "true"
                  prometheus.io/port: "80"
                  prometheus.io/path: "/metrics"
              spec:
                containers:
                - name: web
                  image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.DEPLOY_TAG || 'latest' }}
                  imagePullPolicy: Always
                  ports:
                  - containerPort: 80
                    name: http
                    protocol: TCP
                  resources:
                    requests:
                      memory: "64Mi"
                      cpu: "50m"
                    limits:
                      memory: "128Mi"
                      cpu: "100m"
                  env:
                  - name: REACT_APP_WS_URL
                    value: "wss://ws.power-grid.gmac.io"
                  - name: NODE_ENV
                    value: "production"
                  - name: POD_NAME
                    valueFrom:
                      fieldRef:
                        fieldPath: metadata.name
                  - name: POD_NAMESPACE
                    valueFrom:
                      fieldRef:
                        fieldPath: metadata.namespace
                  - name: POD_IP
                    valueFrom:
                      fieldRef:
                        fieldPath: status.podIP
                  livenessProbe:
                    httpGet:
                      path: /health
                      port: 80
                      scheme: HTTP
                    initialDelaySeconds: 10
                    periodSeconds: 30
                    timeoutSeconds: 5
                    successThreshold: 1
                    failureThreshold: 3
                  readinessProbe:
                    httpGet:
                      path: /health
                      port: 80
                      scheme: HTTP
                    initialDelaySeconds: 5
                    periodSeconds: 10
                    timeoutSeconds: 5
                    successThreshold: 1
                    failureThreshold: 3
                  startupProbe:
                    httpGet:
                      path: /health
                      port: 80
                      scheme: HTTP
                    initialDelaySeconds: 0
                    periodSeconds: 10
                    timeoutSeconds: 5
                    successThreshold: 1
                    failureThreshold: 30
          ---
          apiVersion: v1
          kind: Service
          metadata:
            name: $APP_NAME
            namespace: $NAMESPACE
            labels:
              app: $APP_NAME
              component: frontend
            annotations:
              prometheus.io/scrape: "true"
              prometheus.io/port: "80"
          spec:
            selector:
              app: $APP_NAME
            ports:
            - port: 80
              targetPort: 80
              name: http
              protocol: TCP
          ---
          apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: $APP_NAME
            namespace: $NAMESPACE
            annotations:
              cert-manager.io/cluster-issuer: "letsencrypt-prod"
              nginx.ingress.kubernetes.io/ssl-redirect: "true"
              nginx.ingress.kubernetes.io/proxy-body-size: "1m"
          spec:
            tls:
            - hosts:
              - $INGRESS_HOST
              secretName: $APP_NAME-tls
            rules:
            - host: $INGRESS_HOST
              http:
                paths:
                - path: /
                  pathType: Prefix
                  backend:
                    service:
                      name: $APP_NAME
                      port:
                        number: 80
          EOF
          
          # Apply the deployment
          kubectl apply -f deployment.yaml
          
          # Wait for deployment to be ready
          echo "Waiting for deployment to be ready..."
          kubectl rollout status deployment/$APP_NAME -n $NAMESPACE --timeout=5m || {
            echo "Deployment failed to become ready. Checking pod status..."
            kubectl get pods -n $NAMESPACE -l app=$APP_NAME
            echo ""
            echo "Describing pods for more details..."
            kubectl describe pods -n $NAMESPACE -l app=$APP_NAME
            echo ""
            echo "Checking events..."
            kubectl get events -n $NAMESPACE --sort-by='.lastTimestamp' | tail -20
            exit 1
          }
          
          echo "Deployment complete! Application available at https://$INGRESS_HOST"
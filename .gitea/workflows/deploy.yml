name: Deploy Power Grid Web to Production

on:
  push:
    branches:
      - main
      - master
  pull_request:
    types: [opened, synchronize, reopened]

env:
  REGISTRY: ci.gmac.io
  IMAGE_NAME: mackieg/power-grid-web

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Container Registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ gitea.actor }}
          password: ${{ secrets.GITEATOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push React client Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to K3s
        env:
          KUBECONFIG_CONTENT: ${{ secrets.KUBECONFIG }}
        run: |
          # Setup kubeconfig
          mkdir -p ~/.kube
          echo "$KUBECONFIG_CONTENT" | base64 -d > ~/.kube/config
          
          # Determine deployment environment
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            NAMESPACE="staging"
            APP_NAME="power-grid-pr-${{ github.event.pull_request.number }}"
            INGRESS_HOST="staging-pr-${{ github.event.pull_request.number }}.gmac.io"
          else
            NAMESPACE="default"
            APP_NAME="power-grid-web"
            INGRESS_HOST="power-grid.gmac.io"
          fi
          
          # Create namespace if it doesn't exist
          kubectl create namespace $NAMESPACE --dry-run=client -o yaml | kubectl apply -f -
          
          # Generate deployment manifest
          cat > deployment.yaml <<EOF
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: $APP_NAME
            namespace: $NAMESPACE
          spec:
            replicas: 2
            selector:
              matchLabels:
                app: $APP_NAME
            template:
              metadata:
                labels:
                  app: $APP_NAME
              spec:
                containers:
                - name: web
                  image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
                  ports:
                  - containerPort: 80
                  resources:
                    requests:
                      memory: "64Mi"
                      cpu: "50m"
                    limits:
                      memory: "128Mi"
                      cpu: "100m"
                  env:
                  - name: REACT_APP_WS_URL
                    value: "wss://ws.power-grid.gmac.io"
          ---
          apiVersion: v1
          kind: Service
          metadata:
            name: $APP_NAME
            namespace: $NAMESPACE
          spec:
            selector:
              app: $APP_NAME
            ports:
            - port: 80
              targetPort: 80
          ---
          apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: $APP_NAME
            namespace: $NAMESPACE
            annotations:
              cert-manager.io/cluster-issuer: "letsencrypt-prod"
              nginx.ingress.kubernetes.io/ssl-redirect: "true"
              nginx.ingress.kubernetes.io/proxy-body-size: "1m"
          spec:
            tls:
            - hosts:
              - $INGRESS_HOST
              secretName: $APP_NAME-tls
            rules:
            - host: $INGRESS_HOST
              http:
                paths:
                - path: /
                  pathType: Prefix
                  backend:
                    service:
                      name: $APP_NAME
                      port:
                        number: 80
          EOF
          
          # Apply the deployment
          kubectl apply -f deployment.yaml
          
          # Wait for deployment to be ready
          kubectl rollout status deployment/$APP_NAME -n $NAMESPACE
          
          echo "Deployment complete! Application available at https://$INGRESS_HOST"